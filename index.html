<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：配合 env(safe-area-inset-*) 处理刘海与 Home Indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AutoPCR</title>
    <style>
      :root {
        /* 安全区：组件内统一用 var(--safe-*) 引用，未支持时回落 0px */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      /* 恒定保留文档级滚动条槽位：弹层（日程通知面板等）开合时页面宽度不再抖动。
         仅桌面生效——移动端这条规则会撑出一个幽灵滚动槽，且 100vh 与地址栏收放打架 */
      @media (min-width: 768px) {
        html {
          scrollbar-gutter: stable;
          overflow-y: scroll;
        }
      }

      /* 移动端：禁掉整页橡皮筋，滚动交给内部容器 */
      @media (max-width: 767.98px) {
        html, body {
          overscroll-behavior-y: none;
        }
        body {
          -webkit-text-size-adjust: 100%;
        }

        /* 表单控件：iOS 上 font-size < 16px 会在聚焦时自动放大整页，统一抬到 16px。
           注意这里只改字号——这段 CSS 不在 @layer 内，优先级高于 Chakra 的分层样式，
           再顺手加 min-height 会把组件自己固定的行高（如配置项的 2.25rem）顶坏。
           触控高度由各组件用 minH={{ base: '44px' }} 自己负责。 */
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        select,
        textarea {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
